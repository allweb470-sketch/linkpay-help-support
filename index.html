<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINK PAY</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <!-- Header Logo -->
    <div class="logo-container">
      <img src="https://via.placeholder.com/100" alt="LINK PAY Logo">
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="form-card">
      <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="tel" placeholder="Mobile Number" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn">Login</button>
      <div class="links">
        <a href="#" id="showRegister">Register</a>
        <a href="#">Forgot Password</a>
      </div>
    </form>

    <!-- Register Form (Hidden by default) -->
    <form id="registerForm" class="form-card hidden">
      <h2>Register</h2>
      <div class="input-group">
        <i class="fa-solid fa-user"></i>
        <input type="text" placeholder="Full Name" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-phone"></i>
        <input type="tel" placeholder="Mobile Number" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" placeholder="Password" required>
      </div>
      <button type="submit" class="btn">Submit</button>
      <div class="links">
        <a href="#" id="showLogin">Back to Login</a>
      </div>
    </form>

    <div class="version">v1.2.3</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
